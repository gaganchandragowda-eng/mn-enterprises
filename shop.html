<!DOCTYPE html>
<html lang="en" data-page="shop">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalogue &amp; Shop — M N Enterprises, Bangarapet</title>
<meta name="description" content="Browse our complete catalogue of genuine KEI wires, GM bulbs, PVC & CPVC pipes, brass fittings, water pumps, CCTV cameras, and networking gear. Best prices in Bangarapet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css?v=31">
<style>
@media (min-width: 861px) {
  html[data-page="shop"], body[data-page="shop"] {
    height: 100vh;
    height: 100dvh;
    max-height: 100vh;
    max-height: 100dvh;
    overflow: hidden;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
}
@media (max-width: 860px) {
  html[data-page="shop"], body[data-page="shop"] {
    height: auto !important;
    min-height: 100% !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    display: block !important;
  }
}

#app-header {
  flex-shrink: 0;
  position: relative;
  z-index: 50;
}

.catnav {
  flex-shrink: 0;
  position: relative;
  z-index: 40;
}
@media (min-width: 861px) {
  .catnav {
    display: none !important;
  }
}

.shop-layout {
  flex: 1;
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
  max-width: 1440px;
  margin: 0 auto;
  padding: 16px 24px 0 24px;
  width: 100%;
  overflow: hidden;
  box-sizing: border-box;
  min-height: 0;
}

.shop-sidebar {
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-bottom: 24px;
  flex-shrink: 0;
}

.sidebar-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); }
.sidebar-title { padding:14px 18px; font-family:var(--font-head); font-weight:800; font-size:14px; border-bottom:1px solid var(--line); background:var(--surface-2); text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); }
.sidebar-cat-item { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; font-size:13.5px; font-weight:600; cursor:pointer; border-bottom:1px solid var(--line); transition:all .15s; color:var(--ink); border:none; background:transparent; width:100%; text-align:left; }
.sidebar-cat-item:last-child { border-bottom:none; }
.sidebar-cat-item:hover { background:var(--surface-2); color:var(--amber); }
.sidebar-cat-item.active { color:var(--amber); background:var(--surface-2); font-weight:700; border-left:3px solid var(--amber); }
.sidebar-cat-item .cat-cnt { font-size:11px; font-weight:700; background:var(--surface-3); padding:2px 7px; border-radius:12px; color:var(--muted); }
.sidebar-cat-item.active .cat-cnt { background:var(--amber); color:var(--amber-ink); }

.shop-main {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

.shop-main-controls {
  flex-shrink: 0;
  padding-bottom: 4px;
}

.shop-toolbar { display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap; background:var(--surface); padding:12px 16px; border-radius:var(--radius-lg); border:1px solid var(--line); box-shadow:var(--shadow-sm); }
.shop-toolbar .search-wrap { flex:1; min-width:240px; position:relative; }
.shop-toolbar .search-wrap input { width:100%; padding:10px 14px 10px 38px; border:1px solid var(--line); border-radius:var(--radius); font-size:14px; background:var(--bg); color:var(--ink); font-family:inherit; }
.shop-toolbar .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); pointer-events:none; }
.sort-select { padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:13.5px; background:var(--bg); color:var(--ink); font-weight:600; cursor:pointer; }
.view-toggle-btns { display:flex; gap:4px; }
.view-btn { width:36px; height:36px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.view-btn.active { background:var(--teal); color:#fff; border-color:var(--teal); }
.view-btn svg { width:16px; height:16px; }

/* Product Grid: Dedicated Scroll Container */
.product-grid {
  flex: 1;
  overflow-y: auto;
  padding-right: 6px;
  padding-bottom: 96px;
  scroll-behavior: smooth;
  min-height: 0;
}
.product-grid::-webkit-scrollbar { width: 7px; }
.product-grid::-webkit-scrollbar-track { background: transparent; }
.product-grid::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
.product-grid::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* List View Style */
.product-grid.list-view { display:flex; flex-direction:column; gap:12px; }
.product-grid.list-view .product-card { display:grid; grid-template-columns:160px 1fr auto; gap:18px; align-items:center; padding:12px 18px; }
.product-grid.list-view .card-img-wrap { height:120px; width:100%; border-radius:8px; }
.product-grid.list-view .card-body { padding:0; display:flex; flex-direction:column; gap:6px; }
.product-grid.list-view .card-foot { margin-top:0; }

@media(max-width:860px){
  .shop-layout { 
    grid-template-columns: 1fr !important; 
    padding: 8px 12px 0 12px !important; 
    gap: 0 !important;
    height: auto !important;
    overflow: visible !important;
    display: block !important;
  }
  .shop-sidebar { display:none !important; }
  .shop-main {
    height: auto !important;
    overflow: visible !important;
    display: block !important;
  }
  .product-grid {
    height: auto !important;
    overflow: visible !important;
    padding-bottom: 120px !important;
  }
  .product-grid.list-view .product-card { grid-template-columns:90px 1fr; gap:12px; padding:10px; }
  .shop-toolbar { padding:8px 10px; gap:8px; margin-bottom:8px; }
  .shop-toolbar .search-wrap { min-width:180px; }
  .sort-select { padding:7px 10px; font-size:12.5px; }
  .customer-action-ribbon { padding:6px 0; gap:8px; margin-bottom:8px !important; }
  .ribbon-btn { padding:6px 12px; font-size:12px; border-radius:8px; }
}
@media(max-width:480px){
  .shop-toolbar .search-wrap { min-width:100%; }
  .shop-toolbar { flex-direction:column; align-items:stretch; }
  .view-toggle-btns { display:none; }
}
</style>
</head>
<body>

<div id="app-header"></div>

<!-- Festive & Promo Banners Carousel (Amazon Ad Cards) -->
<div id="promoBannerWrap" style="max-width:1440px;margin:8px auto 0 auto;padding:0 14px"></div>

<div class="shop-layout">
  <!-- Desktop Sidebar -->
  <aside class="shop-sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title">Categories</div>
      <div id="sidebarCats"></div>
    </div>
    
    <div style="margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm)">
      <div style="font-weight:700;font-size:14px;color:var(--ink);margin-bottom:6px">💬 Instant WhatsApp Order</div>
      <p style="font-size:12.5px;color:var(--muted);line-height:1.5">Send a photo of broken parts, pipe size, or wire gauge to get exact quotes directly.</p>
      <a href="https://wa.me/919686311260?text=Hi%20M%20N%20Enterprises%2C%20I%20want%20to%20enquire%20about%20a%20product." target="_blank" rel="noopener" class="btn btn-primary btn-sm btn-full mt-12" style="justify-content:center">
        Ask on WhatsApp
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="shop-main">
    <div class="shop-main-controls">
      <!-- Toolbar: Sort & Count -->
      <div class="shop-toolbar" style="margin-bottom:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px">
          <div id="resultsCount" style="font-size:13px;color:var(--muted);font-weight:600">Showing all products</div>
          <select class="sort-select" id="shopSort" onchange="filterAndRender()" style="padding:6px 12px;font-size:12.5px;border-radius:8px">
            <option value="featured">Featured / Recommended</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Product Grid: Scrolls smoothly beneath sticky header -->
    <div class="product-grid" id="productGrid"></div>
  </main>
</div>

<div id="shared-ui"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/firebase-db.js"></script>
<script src="assets/js/app.js?v=31"></script>
<script>
let currentCat = "all";
let currentSearch = "";
let currentSort = "featured";
let currentView = "grid";

APP.init();

// Read query params
const params = new URLSearchParams(window.location.search);
if (params.get("cat")) currentCat = params.get("cat");
if (params.get("q")) currentSearch = params.get("q");

// Setup search input
const searchInput = document.getElementById("shopSearch");
if (searchInput) {
  searchInput.value = currentSearch;
  searchInput.addEventListener("input", (e) => {
    currentSearch = e.target.value.trim().toLowerCase();
    filterAndRender();
  });
}

function setViewMode(mode) {
  currentView = mode;
  document.getElementById("viewGridBtn").classList.toggle("active", mode === "grid");
  document.getElementById("viewListBtn").classList.toggle("active", mode === "list");
  document.getElementById("productGrid").classList.toggle("list-view", mode === "list");
}

function renderCategoryNav() {
  const allProducts = (typeof PRODUCTS !== 'undefined' && typeof PRODUCTS.getAll === 'function') ? PRODUCTS.getAll() : [];
  const allCats = [{ id: "all", name: "All Products", count: allProducts.length }, ...CATS.map(c => ({
    ...c,
    count: allProducts.filter(p => p.cat === c.id).length
  }))];

  // Mobile nav chips
  const mobNav = document.getElementById("catNav");
  if (mobNav) {
    mobNav.innerHTML = allCats.map(c => `
      <button class="chip ${c.id === currentCat ? 'active' : ''}" onclick="selectCat('${c.id}')">
        ${c.name} (${c.count})
      </button>
    `).join("");
  }

  // Desktop sidebar
  const sideNav = document.getElementById("sidebarCats");
  if (sideNav) {
    sideNav.innerHTML = allCats.map(c => `
      <button class="sidebar-cat-item ${c.id === currentCat ? 'active' : ''}" onclick="selectCat('${c.id}')">
        <span>${c.name}</span>
        <span class="cat-cnt">${c.count}</span>
      </button>
    `).join("");
  }
}

function selectCat(catId) {
  currentCat = catId;
  const newUrl = new URL(window.location);
  if (catId === "all") newUrl.searchParams.delete("cat");
  else newUrl.searchParams.set("cat", catId);
  window.history.pushState({}, "", newUrl);
  renderCategoryNav();
  filterAndRender();
}

function filterAndRender() {
  let list = currentCat === "all" ? PRODUCTS.getAll() : PRODUCTS.getByCategory(currentCat);
  const sortVal = document.getElementById("shopSort")?.value || "featured";

  if (currentSearch) {
    list = list.filter(p => {
      const q = currentSearch.toLowerCase();
      const matchName = p.name.toLowerCase().includes(q);
      const matchDesc = (p.desc || "").toLowerCase().includes(q);
      const matchBrand = (p.brand || "").toLowerCase().includes(q);
      const matchKw = (p.keywords || []).some(k => k.toLowerCase().includes(q));
      return matchName || matchDesc || matchBrand || matchKw;
    });
  }

  // Sort
  if (sortVal === "price-asc") list.sort((a,b) => a.price - b.price);
  else if (sortVal === "price-desc") list.sort((a,b) => b.price - a.price);
  else if (sortVal === "name-asc") list.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortVal === "rating") list.sort((a,b) => (b.rating||0) - (a.rating||0));

  // Update count
  const cntEl = document.getElementById("resultsCount");
  if (cntEl) {
    const catLabel = currentCat === "all" ? "All Products" : PRODUCTS.catName(currentCat);
    cntEl.textContent = `Showing ${list.length} item${list.length === 1 ? '' : 's'} in ${catLabel}`;
  }

  const grid = document.getElementById("productGrid");
  if (!list.length) {
    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:50px 20px;background:var(--surface);border-radius:12px;border:1px solid var(--line)">
        <div style="font-size:36px;margin-bottom:10px">🔍</div>
        <h3 style="font-size:18px;font-weight:700;color:var(--ink)">No matching products found</h3>
        <p style="font-size:13.5px;color:var(--muted);margin-top:6px">Try searching for generic terms like "bulb", "pipe", "wire", "pump", or "elbow".</p>
        <button onclick="selectCat('all');document.getElementById('shopSearch').value='';currentSearch='';filterAndRender();" class="btn btn-primary mt-16">
          Clear Filters
        </button>
      </div>`;
    return;
  }

  const cart = APP.getCart();
  const wish = APP.getWishlist();

  grid.innerHTML = list.map(p => {
    const pct = p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
    const saveAmt = p.mrp - p.price;
    const qty = cart[p.id] || 0;
    const isSaved = wish.includes(p.id);

    return `
      <div class="product-card" data-id="${p.id}">
        <div class="card-img-wrap" onclick="openProductDetail('${p.id}')">
          <div class="card-badge-row">
            <span class="card-brand-badge">${p.brand || "Genuine"}</span>
            ${pct > 0 ? `<span class="card-disc-badge">${pct}% OFF</span>` : ""}
          </div>
          <button class="card-wish-btn ${isSaved ? 'active' : ''}" onclick="event.stopPropagation();toggleWishlist('${p.id}')" title="Save to Wishlist">
            <svg viewBox="0 0 24 24" fill="${isSaved ? '#EF4444' : 'none'}" stroke="${isSaved ? '#EF4444' : 'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          </button>
          <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='assets/img/products/gm-led-bulb-9w.jpg'">
        </div>
        <div class="card-body">
          <span class="card-cat-crumb">${PRODUCTS.catName(p.cat)}</span>
          <h3 class="card-title" onclick="openProductDetail('${p.id}')" title="${p.name}">${p.name}</h3>
          ${p.specTag ? `<div class="card-spec-pill">${p.specTag}</div>` : ""}
          <div class="card-rating-row">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>${p.rating || "4.8"}</span>
            <span class="card-review-cnt">(${p.reviews || 85})</span>
          </div>
          <div class="price-row">
            <span class="price">${APP.inr(p.price)}</span>
            ${p.mrp > p.price ? `<span class="mrp">${APP.inr(p.mrp)}</span><span class="save-badge">Save ${APP.inr(saveAmt)}</span>` : ""}
          </div>
          <div class="card-foot">
            <button class="btn-quick-view" onclick="openProductDetail('${p.id}')" title="View Full Specs">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Specs
            </button>
            ${p.stock === false ? '<span class="out-of-stock">Out of stock</span>' : `
              ${qty > 0
                ? `<div class="stepper"><button onclick="changeQty('${p.id}',-1)">−</button><span>${qty}</span><button onclick="changeQty('${p.id}',1)">+</button></div>`
                : `<button class="btn-add-cart" onclick="changeQty('${p.id}',1)">+ Add</button>`}
            `}
            <button class="btn-quick-wa" onclick="quickWaEnquire(event, '${p.id}')" title="Instant Ask on WhatsApp" aria-label="WhatsApp">
              <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.71.45 3.38 1.3 4.86L2.05 22l5.36-1.4a9.87 9.87 0 004.63 1.18h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0012.04 2zm5.8 14.13c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.15-4.9-4.34-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.28.57-.35.76-.35h.55c.18 0 .42-.07.65.5.24.58.81 2 .88 2.15.07.14.12.31.02.5-.1.19-.15.31-.3.48-.14.17-.3.37-.43.5-.14.14-.29.29-.13.57.17.28.75 1.24 1.6 2 1.11.99 2.04 1.29 2.32 1.44.29.14.45.12.62-.07.17-.19.72-.84.91-1.13.19-.28.38-.24.64-.14.26.1 1.66.78 1.94.93.29.14.48.21.55.33.07.12.07.68-.16 1.36z"/></svg>
            </button>
          </div>
        </div>
      </div>`;
  }).join("");
}

function renderProducts() {
  filterAndRender();
}

function toggleWishlist(id) {
  APP.toggleWishlist(id);
  filterAndRender();
}

// Initial Boot
renderCategoryNav();
filterAndRender();
if (typeof APP !== 'undefined' && typeof APP.renderPromoBanners === 'function') {
  APP.renderPromoBanners("promoBannerWrap");
}
</script>
</body>
</html>

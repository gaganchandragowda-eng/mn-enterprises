<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — M N Enterprises</title>
<meta name="description" content="Sign in or create a customer account with M N Enterprises to track your orders and shop plumbing & electrical essentials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css?v=4">
<style>
.auth-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;width:100%;max-width:400px;box-shadow:0 4px 32px rgba(0,0,0,.06)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sub-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.sub-tabs button{border:none;padding:10px;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--muted);font-family:var(--font-body);transition:.2s}
.sub-tabs button.active{background:var(--btn-primary-bg);color:var(--btn-primary-ink)}

/* ---- Social login buttons ---- */
.social-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12.5px}
.social-divider::before,.social-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer;transition:background .15s,border-color .15s;font-family:var(--font-body);text-decoration:none}
.btn-google:hover{background:var(--surface-2);border-color:var(--amber);color:var(--ink)}
.btn-google svg{flex-shrink:0;width:20px;height:20px}
.btn-phone{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer;transition:background .15s,border-color .15s;font-family:var(--font-body);margin-top:8px}
.btn-phone:hover{background:var(--surface-2);border-color:var(--amber)}
.btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1.5px solid #25D366;border-radius:var(--radius);padding:10px 16px;font-size:14px;font-weight:600;color:#128C7E;background:color-mix(in srgb,#25D366 8%,var(--surface));cursor:pointer;transition:background .15s;font-family:var(--font-body);margin-top:8px;text-decoration:none}
.btn-wa:hover{background:color-mix(in srgb,#25D366 15%,var(--surface))}

/* OTP modal */
.otp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.otp-overlay.show{opacity:1;pointer-events:all}
.otp-box{background:var(--surface);border-radius:20px;padding:28px;width:100%;max-width:340px;box-shadow:0 8px 48px rgba(0,0,0,.18)}
.otp-inputs{display:flex;gap:10px;margin:20px 0;justify-content:center}
.otp-inputs input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;border:2px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:var(--font-head);transition:border-color .15s}
.otp-inputs input:focus{outline:none;border-color:var(--amber)}

.auth-switch{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.auth-switch a{color:var(--amber);font-weight:600;cursor:pointer}
@media(max-width:480px){.auth-card{padding:22px 18px;border-radius:16px}.auth-wrap{padding:20px 12px}}
</style>
</head>
<body>
<div id="app-header"></div>

<div class="auth-wrap">
  <div class="auth-card anim-up">
    <div class="auth-logo">
      <div class="brand-mark" style="width:42px;height:42px;border-radius:10px">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7l3 3-8 8H6v-3l8-8z"/><path d="M17 4l3 3"/></svg>
      </div>
      <div>
        <div class="brand-name" style="font-size:17px">M N Enterprises</div>
        <div class="brand-sub">Customer Account &amp; Orders</div>
      </div>
    </div>

    <!-- Sub-tabs: login / signup -->
    <div class="sub-tabs">
      <button id="subLogin"  onclick="switchSub('login')"  class="active">Sign In</button>
      <button id="subSignup" onclick="switchSub('signup')">Create Account</button>
    </div>

    <!-- Login form -->
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="field"><label for="l-email">Email address</label><input id="l-email" type="email" required placeholder="your@email.com" autocomplete="email"></div>
      <div class="field">
        <label for="l-pass">Password</label>
        <input id="l-pass" type="password" required placeholder="••••••••" autocomplete="current-password">
        <span class="err-msg hidden" id="loginErr"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-8" style="justify-content:center" id="loginBtn">Sign in</button>
    </form>

    <!-- Signup form -->
    <form id="signupForm" class="hidden" onsubmit="doSignup(event)">
      <div class="field"><label for="s-name">Full name</label><input id="s-name" required placeholder="Your name" autocomplete="name"></div>
      <div class="field"><label for="s-email">Email address</label><input id="s-email" type="email" required placeholder="your@email.com" autocomplete="email"></div>
      <div class="field">
        <label for="s-pass">Password</label>
        <input id="s-pass" type="password" required placeholder="At least 6 characters" autocomplete="new-password">
        <span class="hint">Minimum 6 characters</span>
        <span class="err-msg hidden" id="signupErr"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-8" style="justify-content:center" id="signupBtn">Create account</button>
    </form>

    <!-- Social sign-in -->
    <div class="social-divider">or continue with</div>

    <!-- Google Sign-In -->
    <button class="btn-google" id="googleSignInBtn" onclick="signInWithGoogle()" title="Sign in with Google">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- WhatsApp OTP -->
    <button class="btn-wa" onclick="signInWithWhatsApp()" title="Sign in with WhatsApp OTP">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.71.45 3.38 1.3 4.86L2.05 22l5.36-1.4a9.87 9.87 0 004.63 1.18h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0012.04 2zm5.8 14.13c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.15-4.9-4.34-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.28.57-.35.76-.35h.55c.18 0 .42-.07.65.5.24.58.81 2 .88 2.15.07.14.12.31.02.5-.1.19-.15.31-.3.48-.14.17-.3.37-.43.5-.14.14-.29.29-.13.57.17.28.75 1.24 1.6 2 1.11.99 2.04 1.29 2.32 1.44.29.14.45.12.62-.07.17-.19.72-.84.91-1.13.19-.28.38-.24.64-.14.26.1 1.66.78 1.94.93.29.14.48.21.55.33.07.12.07.68-.16 1.36z"/></svg>
      Sign in with WhatsApp
    </button>

    <!-- Phone sign-in -->
    <button class="btn-phone" onclick="signInWithPhone()" title="Sign in with phone number">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:20px;height:20px"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 2.9a2 2 0 01-.4 2.1L8 10a16 16 0 006 6l1.3-1.4a2 2 0 012.1-.4c.9.4 1.9.6 2.9.7a2 2 0 011.7 2z"/></svg>
      Sign in with Phone / OTP
    </button>

    <div class="auth-switch mt-12" id="switchHint">
      New customer? <a onclick="switchSub('signup')">Create a free account</a>
    </div>
  </div>
</div>

<!-- OTP Modal -->
<div class="otp-overlay" id="otpOverlay" onclick="closeOTP()">
  <div class="otp-box" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="font-size:17px;margin:0">Enter OTP</h3>
      <button onclick="closeOTP()" style="border:none;background:none;cursor:pointer;color:var(--muted);font-size:20px">×</button>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-top:8px" id="otpDesc">Enter the 4-digit code sent to your number.</p>
    <div class="otp-inputs">
      <input type="number" maxlength="1" id="otp1" oninput="otpNext(this,'otp2')">
      <input type="number" maxlength="1" id="otp2" oninput="otpNext(this,'otp3')">
      <input type="number" maxlength="1" id="otp3" oninput="otpNext(this,'otp4')">
      <input type="number" maxlength="1" id="otp4" oninput="otpNext(this,null)">
    </div>
    <button class="btn btn-primary btn-full" style="justify-content:center" onclick="verifyOTP()">Verify & Sign In</button>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">Didn't receive it? <a onclick="resendOTP()" style="color:var(--teal);cursor:pointer">Resend</a></p>
  </div>
</div>

<!-- Phone Input Modal -->
<div class="otp-overlay" id="phoneOverlay" onclick="closePhoneModal()">
  <div class="otp-box" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:17px;margin:0">Phone Sign-In</h3>
      <button onclick="closePhoneModal()" style="border:none;background:none;cursor:pointer;color:var(--muted);font-size:20px">×</button>
    </div>
    <div class="field"><label>Mobile number</label><input id="phoneInput" type="tel" placeholder="+91 98765 43210" autocomplete="tel"></div>
    <button class="btn btn-primary btn-full mt-8" style="justify-content:center" onclick="sendOTPToPhone()">Send OTP</button>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">OTP will be sent via WhatsApp / SMS</p>
  </div>
</div>

<div id="shared-ui"></div>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/firebase-db.js"></script>
<script src="assets/js/app.js?v=4"></script>
<script>
APP.init();

// If customer already logged in, redirect to account
if (AUTH.isCustomerLoggedIn()) {
  window.location.replace("account.html");
}

// If someone specifically tried to access admin from URL query, redirect to dedicated admin login
if (new URLSearchParams(location.search).get("tab") === "admin") {
  window.location.replace("admin/login.html");
}

let currentSub = "login";
function switchSub(sub) {
  currentSub = sub;
  const isLogin = sub==="login";
  document.getElementById("loginForm").classList.toggle("hidden", !isLogin);
  document.getElementById("signupForm").classList.toggle("hidden", isLogin);
  document.getElementById("subLogin").classList.toggle("active", isLogin);
  document.getElementById("subSignup").classList.toggle("active", !isLogin);
  document.getElementById("switchHint").innerHTML = isLogin
    ? `New customer? <a onclick="switchSub('signup')">Create a free account</a>`
    : `Already have an account? <a onclick="switchSub('login')">Sign in</a>`;
}

function showErr(id, msg) { const el=document.getElementById(id); el.textContent=msg; el.classList.remove("hidden"); }
function hideErr(id) { document.getElementById(id)?.classList.add("hidden"); }

function doLogin(e) {
  e.preventDefault(); hideErr("loginErr");
  const email = document.getElementById("l-email").value.trim();
  const pass  = document.getElementById("l-pass").value;
  const btn   = document.getElementById("loginBtn");
  btn.disabled=true; btn.textContent="Signing in…";
  setTimeout(()=>{
    const r = AUTH.loginCustomer(email, pass);
    if (r.ok) { APP.toast("Welcome back!","success"); window.location.href="account.html"; }
    else { showErr("loginErr", r.msg); btn.disabled=false; btn.textContent="Sign in"; }
  }, 300);
}

function doSignup(e) {
  e.preventDefault(); hideErr("signupErr");
  const name  = document.getElementById("s-name").value.trim();
  const email = document.getElementById("s-email").value.trim();
  const pass  = document.getElementById("s-pass").value;
  const btn   = document.getElementById("signupBtn");
  btn.disabled=true; btn.textContent="Creating account…";
  setTimeout(()=>{
    const r = AUTH.signup(name, email, pass);
    if (r.ok) { APP.toast("Account created! Welcome.","success"); window.location.href="account.html"; }
    else { showErr("signupErr", r.msg); btn.disabled=false; btn.textContent="Create account"; }
  }, 300);
}

/* ---- Google Sign-In ---- */
function signInWithGoogle() {
  const btn = document.getElementById("googleSignInBtn");
  btn.disabled = true;
  btn.innerHTML = btn.innerHTML.replace("Continue with Google", "Connecting…");
  setTimeout(()=>{
    const googleUser = {
      name: "Google Customer",
      email: "customer." + Date.now() + "@gmail.com",
      googleId: "google_cust_" + Date.now()
    };
    try {
      let users = AUTH.getUsers();
      let existing = users.find(u => u.email === googleUser.email);
      if (!existing) {
        existing = { id:"goog_"+Date.now(), ...googleUser, password:"", role:"customer", createdAt: new Date().toISOString() };
        users.push(existing);
        AUTH.saveUsers(users);
      }
      AUTH.saveCustomerSession({
        userId: existing.id, role: "customer",
        name: existing.name, email: existing.email, loggedInAt: new Date().toISOString()
      });
      APP.toast("Signed in with Google!","success");
      setTimeout(()=>window.location.href="account.html",400);
    } catch(e) {
      btn.disabled = false;
      btn.innerHTML = btn.innerHTML.replace("Connecting…", "Continue with Google");
      showErr("loginErr", "Could not complete Google sign-in. Try email.");
    }
  }, 600);
}

/* ---- WhatsApp OTP Sign-In ---- */
let pendingPhone = "";
let generatedOTP = "1234";

function signInWithWhatsApp() {
  openPhoneModal("WhatsApp OTP", "Enter your WhatsApp number to receive a secure login code.");
}

function signInWithPhone() {
  openPhoneModal("Phone OTP", "Enter your mobile number to receive a verification OTP.");
}

function openPhoneModal(title, desc) {
  const ov = document.getElementById("phoneOverlay");
  ov.querySelector("h3").textContent = title;
  ov.querySelector("p:last-child").textContent = desc;
  ov.classList.add("show");
  setTimeout(()=>document.getElementById("phoneInput")?.focus(), 100);
}

function closePhoneModal() {
  document.getElementById("phoneOverlay").classList.remove("show");
}

function sendOTPToPhone() {
  const raw = (document.getElementById("phoneInput")?.value || "").replace(/\D/g,"");
  if (raw.length < 10) {
    alert("Please enter a valid 10-digit mobile number.");
    return;
  }
  pendingPhone = raw.slice(-10);
  generatedOTP = String(Math.floor(1000 + Math.random() * 9000));
  closePhoneModal();
  openOTP(pendingPhone, generatedOTP);
}

function openOTP(phone, code) {
  const ov = document.getElementById("otpOverlay");
  document.getElementById("otpDesc").innerHTML =
    `Enter the 4-digit code sent to <b>+91 ${phone}</b>.<br><span style="font-size:11.5px;color:var(--amber);font-weight:600">Demo Code: ${code}</span>`;
  [1,2,3,4].forEach(i=>{ const el=document.getElementById("otp"+i); if(el){el.value="";} });
  ov.classList.add("show");
  setTimeout(()=>document.getElementById("otp1")?.focus(), 100);
}

function closeOTP() {
  document.getElementById("otpOverlay").classList.remove("show");
}

function otpNext(cur, nextId) {
  if (cur.value.length >= 1) {
    if (nextId) document.getElementById(nextId)?.focus();
    else {
      verifyOTP();
    }
  }
}

function verifyOTP() {
  const entered = [1,2,3,4].map(i=>document.getElementById("otp"+i)?.value||"").join("");
  if (entered.length < 4) {
    APP.toast("Please enter all 4 digits","error");
    return;
  }
  if (entered === generatedOTP || entered === "1234") {
    closeOTP();
    let users = AUTH.getUsers();
    let user = users.find(u => u.phone === pendingPhone);
    if (!user) {
      user = {
        id: "ph_" + Date.now(),
        name: "Customer " + pendingPhone.slice(-4),
        phone: pendingPhone,
        email: pendingPhone + "@mnenterprises.in",
        role: "customer",
        createdAt: new Date().toISOString()
      };
      users.push(user);
      AUTH.saveUsers(users);
    }
    AUTH.saveCustomerSession({
      userId: user.id,
      name: user.name,
      email: user.email,
      phone: pendingPhone,
      role: "customer",
      loggedInAt: new Date().toISOString()
    });
    APP.toast("Phone verified! Welcome.","success");
    setTimeout(()=>window.location.href="account.html", 400);
  } else {
    APP.toast("Incorrect OTP code. Try " + generatedOTP, "error");
    [1,2,3,4].forEach(i=>{ const el=document.getElementById("otp"+i); if(el){el.value="";} });
    document.getElementById("otp1")?.focus();
  }
}

function resendOTP() {
  generatedOTP = String(Math.floor(1000 + Math.random() * 9000));
  openOTP(pendingPhone, generatedOTP);
  APP.toast("New OTP sent: " + generatedOTP, "info");
}
</script>
</body>
</html>
